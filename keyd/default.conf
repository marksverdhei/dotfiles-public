# keyd — system-wide key remaps. Linked to /etc/keyd/default.conf by
# bootstrap/main.bash (requires passwordless sudo).
#
# The PHYSICAL Esc key is dual-function, for the ears ASR dogfood:
#   tap  (< 250 ms)  -> F14 (xkb code 192) -> ears toggle  (dictate: tap, speak, tap)
#   hold (>= 250 ms) -> F15 (xkb code 193) -> ears vad     (hands-free, auto-segmenting)
# The Hyprland side lives in private/omarchy/keybinds.conf (code:192) and
# private/hypr/bindings.conf (code:193). xkb code = evdev code + 8.
#
# Escape is NOT lost: hypr/input.conf sets `kb_options = caps:escape`, and keyd
# leaves CapsLock alone — so CapsLock is Escape, and Super+CapsLock is the
# Omarchy system menu that used to be Super+Escape.
#
# Panic hatch: press backspace+escape+enter together to terminate keyd, or
#   sudo systemctl stop keyd
[ids]
*

[main]
esc = timeout(f14, 250, f15)
