# keyd — system-wide key remaps. Linked to /etc/keyd/default.conf by
# bootstrap/main.bash (requires passwordless sudo).
#
# The PHYSICAL Esc key is dual-function, for the ears ASR dogfood:
#   tap  (< 250 ms)  -> F14 (xkb code 192) -> ears toggle  (dictate: tap, speak, tap)
#   hold (>= 250 ms) -> F15 (xkb code 193) -> ears vad     (hands-free, auto-segmenting)
# The Hyprland side lives in private/omarchy/keybinds.conf (code:192) and
# private/hypr/bindings.conf (code:193). xkb code = evdev code + 8.
#
# CapsLock stays Escape. hypr/input.conf sets `kb_options = caps:escape`, which
# xkb applies DOWNSTREAM of keyd — keyd never sees a CapsLock-derived Escape,
# so it cannot eat it. Verified by injection on centurion.
#
# THE EXCEPTION, and why the Wooting is excluded below: a board that does
# caps->esc in its own FIRMWARE emits a real KEY_ESC for CapsLock. keyd cannot
# distinguish that from the physical Esc key, so it would swallow CapsLock too
# and you would lose Escape entirely. Any keyboard with a firmware-level
# caps->esc remap must be excluded here, not just the Wooting.
#
# Panic hatch: press backspace+escape+enter together to terminate keyd, or
#   sudo systemctl stop keyd
[ids]
*
# Wooting 60HE (centurion's daily driver) — remaps caps->esc in firmware.
-31e3:1312
# ydotoold virtual device — this is what agents type through. Remapping a
# SYNTHETIC device is never what you want: an agent sending Escape via
# `ydotool key 1:1` would silently get F14 and fire ears instead. Excluding it
# also means the tap/hold mapping can no longer be verified by injection —
# it has to be tested on a real keyboard.
-2333:6666

[main]
esc = timeout(f14, 250, f15)
